name: Wire PayPal checkout

on:
  push:
    paths:
      - '.github/workflows/wire-paypal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire PayPal script into existing page
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  // Replace with the live PayMongo checkout link before deploy.'
          start = s.find(marker)
          if start == -1:
              raise SystemExit('PayPal placeholder block not found; refusing to modify index.html.')
          end = s.find('</script>', start)
          if end == -1:
              raise SystemExit('PayPal placeholder script end not found; refusing to modify index.html.')
          end += len('</script>')
          s = s[:start] + s[end:]
          if '<script src="/paypal.js"></script>' not in s:
              s = s.replace('</body>', '<script src="/paypal.js"></script>\n</body>', 1)
          p.write_text(s, encoding='utf-8')

          a = Path('api/ask.js')
          t = a.read_text(encoding='utf-8')
          old = 'HOW TO PAY:\\nPayPal or card, billed at $7. Or Philippine QR payment of P399 via BDO InstaPay, GCash, Maya, or any Philippine bank app. Payment is verified manually: after paying, the visitor clicks the star circle at the bottom right of the page and submits their name and payment reference number. Access is not issued automatically.'
          new = 'HOW TO PAY:\\nPayPal or card, billed at $7 through the site checkout. Successful PayPal/card payment unlocks Founding Access automatically. Philippine QR payment is P399 via BDO InstaPay, GCash, Maya, or any Philippine bank app; that route remains manual: after paying, the visitor clicks the star circle at the bottom right of the page and submits their name and payment reference number.'
          if old in t:
              a.write_text(t.replace(old, new), encoding='utf-8')
          PY
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html api/ask.js
          git diff --cached --quiet && exit 0
          git commit -m 'Wire PayPal checkout into Founding Access'
          git push
